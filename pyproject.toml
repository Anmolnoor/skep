[project]
name = "skep"
version = "1.0.2"
description = "Govern AI coding agents with sandboxing, verification, approvals, and audit trails."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anmol Noor" }]
keywords = [
    "ai-agents",
    "approval-workflow",
    "automation",
    "coding-agent",
    "sandbox",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "ddgs>=9.14.4",
    "fastapi>=0.115",
    # v6: the serve daemon's own LLM client (chat); also FastAPI's TestClient.
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn>=0.30",
    "websockets>=16.1",
]

[project.optional-dependencies]
# v53-F6 (ADR 0031): voice providers are OPTIONAL — skep is text-first.
# piper-tts is local; edge-tts is Microsoft's CLOUD service (reply text
# egresses when chosen). Neither installs by default.
voice = [
    "edge-tts>=6.1",
    "piper-tts>=1.2",
]

# v84-F1: the document toolchain is OPTIONAL — Office/PDF libraries never
# install by default; workers state honestly what is present (I12).
documents = [
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
# pytesseract wraps the tesseract SYSTEM binary (apt install tesseract-ocr /
# brew install tesseract) — the pip install alone cannot OCR anything (A4).
ocr = [
    "pillow>=10",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
skep = "skep.cli:main"

[project.urls]
Homepage = "https://skep.anmolnoor.com"
Documentation = "https://github.com/Anmolnoor/skep/tree/main/docs"
Issues = "https://github.com/Anmolnoor/skep/issues"
Source = "https://github.com/Anmolnoor/skep"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skep"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = [
    "src/skep/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/skep", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke, container, and external-app checks are opt-in from Makefile targets.
addopts = "-q -m 'not smoke and not container and not external_app'"
markers = [
    "smoke: end-to-end golden smoke scenarios (Stage 3)",
    "container: opt-in containerized-worker proof; needs Docker, never the gate (Q1-B)",
    "external_app: opt-in whole-app test with live network, paid LLM, and Docker",
]

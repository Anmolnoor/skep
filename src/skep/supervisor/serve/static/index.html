<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>skep</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-card">
      <h1>skep</h1>
      <p>Paste the access token from the server boot log.</p>
      <input id="token-input" type="password" placeholder="access token" autocomplete="off">
      <button id="token-save">Connect</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <nav class="sidebar" aria-label="Primary">
      <!-- H1 (hive-rooms C10): the sidebar replaced the 60px icon rail. Every
           data-ws anchor stays (structure tests pin them); the old workspaces
           fold into the groups under the threads. -->
      <div class="sidebar-head">
        <a class="brand" href="#/home" title="skep" aria-label="skep — home">skep</a>
        <span id="sidebar-machine" class="sidebar-machine" title="the machine this daemon runs on"></span>
        <div id="health" class="health" title="daemon status">…</div>
      </div>
      <div class="rail-group" data-group="daily">
        <a href="#/home" data-ws="home" title="Home">Home</a>
        <a id="sidebar-new-chat" href="#/chat" data-nav="new-chat" data-ws="chat" title="New thread">New thread</a>
        <a href="#/inbox" data-ws="inbox" title="Inbox — everything waiting on you">Inbox <span id="inbox-badge" class="badge hidden"></span></a>
      </div>
      <!-- H1-G3: one search. ⌘K (this row) is the search — pages and run ids.
           It does not find threads, so the thread list keeps its own filter,
           drawn as a quiet row rather than a second search box. -->
      <button id="sidebar-search" class="sidebar-search" type="button" aria-label="search pages and runs (⌘K)">
        <span>Search</span><kbd class="topbar-kbd">⌘K</kbd>
      </button>
      <input id="thread-search" class="chat-sidebar-search" type="search" autocomplete="off"
             placeholder="Filter threads" aria-label="search threads">
      <div id="sidebar-threads" class="sidebar-threads" role="navigation" aria-label="Threads"></div>
      <div class="sidebar-nav">
        <details class="rail-group" data-group="runs">
          <summary>Runs</summary>
          <a href="#/runs" data-ws="runs" title="Runs">Runs</a>
          <a href="#/approvals" data-ws="approvals" title="Approvals">Approvals <span id="approvals-badge" class="badge hidden"></span></a>
          <a href="#/assign" data-ws="assign" title="Assign">Assign</a>
        </details>
        <a href="#/schedules" data-ws="schedules" title="Schedules">Schedules</a>
        <details class="rail-group" data-group="library">
          <summary>Library</summary>
          <a href="#/templates" data-ws="templates" title="Templates &amp; Skills">Templates &amp; Skills</a>
          <a href="#/notes" data-ws="notes" title="Notes &amp; Tasks">Notes &amp; Tasks <span id="tasks-badge" class="badge hidden"></span></a>
          <a href="#/memory" data-ws="memory" title="Memory">Memory <span id="memory-badge" class="badge hidden"></span></a>
        </details>
        <a href="#/policies" data-ws="policies" title="Policies">Policies</a>
        <!-- Graphite round A: one Settings link. Projects and Setup are its
             tabs; #/projects… and #/setup light it (setShellActiveRoute). -->
        <a href="#/settings" data-ws="settings" title="Settings">Settings</a>
      </div>
    </nav>

    <div class="workspace">
      <!-- H1-G2: one header line per view. The global top bar is gone: this row
           is the view's own header — its title, then the controls that view
           owns (route() clears #view-controls; a view fills it). The list
           filter, the Queen tile and + Assign show only on the views they
           belong to (updateShellChrome / route). -->
      <header class="topbar">
        <div id="topbar-title" class="topbar-title">Home</div>
        <div id="view-controls" class="view-controls"></div>
        <label class="topbar-search" hidden>
          <span class="topbar-search-icon" aria-hidden="true"></span>
          <input id="app-search" type="search" autocomplete="off"
                 placeholder="Filter this list" aria-label="Search this view">
        </label>
        <div id="topbar-queen-status" class="topbar-queen-status hidden">
          <span class="queen-dot" aria-hidden="true"></span>
          <span id="queen-model-label" class="queen-model-label mono"></span>
        </div>
        <a class="topbar-assign primary" href="#/assign">+ Assign</a>
      </header>

      <main id="main"></main>

      <div id="dock" class="dock">
        <form id="dock-form" class="dock-composer">
          <span class="dock-dot" aria-hidden="true"></span>
          <!-- v104-F0: the class is load-bearing. Every .dock-input rule
               (flex: 1, transparent background, no border) matched nothing
               while this carried only the id, so the home-page composer
               rendered as a default boxed input ~20 characters wide with the
               model label crammed against it. -->
          <input id="dock-input" class="dock-input" type="text" autocomplete="off"
                 placeholder="Message the hive — the Queen is listening…" aria-label="Message the hive">
          <span id="dock-model" class="dock-model"></span>
          <button type="submit" class="dock-send icon-button" title="send" aria-label="send message">
            <span class="button-icon" aria-hidden="true">↑</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>

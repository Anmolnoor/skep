# Agent-presence detection patterns — DATA ONLY (first-run L1).
#
# Source:  https://github.com/herdrdev/herdr (formerly ogulcancelik/herdr)
# Commit:  ee5bfb5041bb3e4a49d591c72308aae3c81ecdde (read 2026-11-09)
# Files:   src/detect/mod.rs (lookup_agent: process names / aliases)
#          src/detect/manifests/*.toml (state rules)
# License: Apache License 2.0 — full text beside this file in LICENSE-herdr.txt
#          (copied verbatim from herdr's LICENSE at that commit). herdr ships
#          no NOTICE file at that commit; attribution is in skep's NOTICE.
#
# Modified from the source: only process names and literal output substrings
# were taken, lower-cased and flattened to "all of these substrings appear in
# the output tail" groups. herdr's rule engine (screen regions, priorities,
# regex and negation clauses, OSC titles) was NOT ported — no herdr code is in
# skep. A few substrings were lifted out of herdr regexes (e.g. Claude's
# "esc to interrupt"); they are marked inline.
#
# Shape, one [[agents]] table per agent:
#   id       herdr's agent label
#   names    executable basenames that identify the agent in `ps`
#   blocked  groups — any group whose substrings ALL appear => blocked
#   working  groups — checked only when no blocked group matched
# No group matched => idle.

[[agents]]
id = "claude"
names = ["claude", "claude-code"]
blocked = [
  ["do you want to proceed?", "esc to cancel"],
  ["do you want to proceed?", "bash command"],
  ["do you want to proceed?", "tab to amend"],
  ["run a dynamic workflow?", "esc to cancel"],
  ["waiting for permission"],
  ["do you want to allow this connection?"],
  ["ctrl+e to explain"],
]
working = [
  ["esc to interrupt"],  # from herdr's live_turn_working line_regex
  ["background agents to finish"],  # from background_agents_working
]


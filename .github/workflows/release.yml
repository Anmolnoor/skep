name: Release

on:
  push:
    tags:
      - "v*"
  # Manual trigger runs the TestPyPI rehearsal lane only (see the
  # testpypi-rehearsal job); it can never publish to real PyPI or cut a
  # GitHub release.
  workflow_dispatch:

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
      - name: Sync
        run: uv sync --frozen
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks \
            --pattern 'gitleaks_*_linux_x64.tar.gz' --output - | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Gate
        run: UV_CACHE_DIR=.uv-cache scripts/local-release-gates.sh

  package:
    needs: release-gate
    # Tags only — a manual dispatch must never reach the GitHub-release step.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Install built wheel smoke
        run: UV_CACHE_DIR=.uv-cache scripts/package-install-smoke.sh
      # Publishes via the PyPI trusted publisher (Anmolnoor/skep +
      # release.yml, configured at LAUNCH-1-L7); id-token: write above is the
      # OIDC half of that handshake.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/skep-*.tar.gz
            dist/skep-*-py3-none-any.whl
          generate_release_notes: true

  # v37-F1: the publish rehearsal. Manual-only; exercises the exact trusted-
  # publisher OIDC path against test.pypi.org with zero public commitment.
  # Requires a TestPyPI trusted publisher (repository Anmolnoor/skep,
  # workflow release.yml) — see docs/releases/README.md "Go/no-go".
  testpypi-rehearsal:
    needs: release-gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

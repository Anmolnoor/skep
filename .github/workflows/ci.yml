name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# v114: one run per change. `push:` with no filter plus `pull_request:` ran
# the whole matrix twice at once on every PR push; the twin macOS jobs raced
# on the runner and the slower one timed out its workers (12 `worker_timeout`
# failures in one 8-minute job on 2026-10-21, zero in the 5-minute twin).
# A superseded run of the same PR is cancelled rather than finished.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite takes ~7 min; a runner whose apt mirror is unreachable once
    # sat in `apt-get update` for the full 6-hour default (PR #33, d21014b).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y bubblewrap ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Sync
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src/skep tests scripts
      - name: Types
        run: uv run mypy
      - name: Unit tests
        # TMPDIR outside /tmp is mandatory wherever bubblewrap runs: bwrap
        # tmpfs-masks /tmp, which eats sandbox evidence files and wedges
        # dispatched test runs into worker_timeout (same rule as CLAUDE.md's
        # local gates).
        run: |
          mkdir -p "$HOME/.cache/skep-test-tmp"
          TMPDIR="$HOME/.cache/skep-test-tmp" uv run --with pytest-xdist pytest -n auto -m "not smoke and not container"
      - name: First-party smoke
        run: make smoke
      - name: Linux sandbox smoke
        if: runner.os == 'Linux'
        run: UV_CACHE_DIR=.uv-cache scripts/linux-sandbox-smoke.sh
      - name: Release hygiene scan
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks \
            --pattern 'gitleaks_*_linux_x64.tar.gz' --output - | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          ./scripts/release-hygiene-scan.sh

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot-check image
        run: |
          SKEP_DOCKER_IMAGE=ghcr.io/anmolnoor/skep:ci \
          SKEP_DOCKER_CONTAINER=skep-ci \
          SKEP_DOCKER_PORT=8765 \
          scripts/docker-image-smoke.sh
      - name: Push on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/anmolnoor/skep:ci "ghcr.io/anmolnoor/skep:${{ github.ref_name }}"
          docker tag ghcr.io/anmolnoor/skep:ci ghcr.io/anmolnoor/skep:latest
          docker push "ghcr.io/anmolnoor/skep:${{ github.ref_name }}"
          docker push ghcr.io/anmolnoor/skep:latest

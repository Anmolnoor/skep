<!doctype html>

<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />

<style>
.docs-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 240px; align-items: start; max-width: 1560px; margin: 0 auto; width: 100%; }
@media (max-width: 1180px) { .docs-layout { grid-template-columns: 250px minmax(0, 1fr); } .rail-right { display: none; } }
@media (max-width: 860px) { .docs-layout { grid-template-columns: minmax(0, 1fr); } .rail-left { display: none; } }
.rail-left { position: sticky; top: 68px; max-height: calc(100vh - 68px); padding: 24px 20px 40px; border-right: 1px solid var(--line-hair); overflow-y: auto; }
.rail-right { position: sticky; top: 68px; max-height: calc(100vh - 68px); padding: clamp(24px, 3vw, 40px) 20px 40px; overflow-y: auto; }
.nav-group-title { margin-bottom: 10px; padding-left: 12px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-void); }
.nav-group { display: grid; gap: 1px; margin-bottom: 24px; font-size: 13.5px; color: var(--text-muted); }
.nav-group a { padding: 7px 12px; border-radius: 7px; }
.nav-group a:hover { background: #0F1214; color: var(--text-bright); }
.nav-group a.here { background: rgba(123,224,140,0.09); color: var(--green); font-weight: 600; }

/* rendered markdown */
.md { max-width: 820px; font-size: 15.5px; line-height: 1.7; color: var(--text-mid); }
.md h1 { margin: 0 0 18px; font-size: clamp(30px, 3.2vw, 42px); font-weight: 700; line-height: 1.06; letter-spacing: -0.03em; color: var(--text-bright); }
.md h2 { margin: 40px 0 12px; padding-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-bright); }
.md h3 { margin: 28px 0 10px; font-size: 18px; font-weight: 650; color: var(--text-bright); }
.md h4 { margin: 22px 0 8px; font-size: 15.5px; font-weight: 650; color: var(--text-soft); }
.md p { margin: 0 0 14px; }
.md a { color: var(--green); }
.md a:hover { color: var(--orange); }
.md code { padding: 2px 6px; border: 1px solid var(--line-inner); border-radius: 5px; background: var(--bg-chip); font-size: 13px; color: var(--text-soft); }
.md pre { margin: 0 0 18px; padding: 16px; border: 1px solid var(--line-inner); border-radius: 10px; background: #08090B; font-size: 13px; line-height: 1.75; overflow-x: auto; }
.md pre code { padding: 0; border: 0; background: none; color: var(--text-mid); }
.md ul, .md ol { margin: 0 0 14px; padding-left: 26px; }
.md li { margin-bottom: 6px; }
.md blockquote { margin: 0 0 14px; padding: 10px 16px; border-left: 3px solid var(--orange); background: var(--bg-card); border-radius: 0 8px 8px 0; color: var(--text-dim); }
.md blockquote p:last-child { margin-bottom: 0; }
.md hr { margin: 28px 0; border: 0; border-top: 1px solid var(--line-hair); }
.md table { width: 100%; margin: 0 0 18px; border-collapse: collapse; font-size: 14px; }
.md th, .md td { padding: 9px 12px; border: 1px solid var(--line-inner); text-align: left; vertical-align: top; }
.md th { background: var(--bg-card); font-weight: 650; color: var(--text-bright); }
.md td { color: var(--text-mid); }
.md .tablewrap { overflow-x: auto; margin: 0 0 18px; }
.md .tablewrap table { margin: 0; }
.toc { display: grid; gap: 8px; font-size: 13px; color: var(--text-faint); }
.toc a { display: block; padding: 3px 0; }
.toc a:hover { color: var(--text-bright); }
</style>
</head>
<body data-page="docs">

<div class="docs-layout">
  <aside class="rail-left" id="doc-nav"></aside>

  <main style="min-width: 0; padding: clamp(24px, 3vw, 40px) clamp(16px, 2.5vw, 40px) 64px;">
    <nav style="display: flex; align-items: center; gap: 9px; margin-bottom: 22px; font-size: 13px; color: var(--text-void);" aria-label="Breadcrumb">
      <a href="./docs.html" style="display: flex; align-items: center; gap: 6px;"><i data-lucide="book-open" style="width: 13px; height: 13px;"></i><span>Docs</span></a>
      <i data-lucide="chevron-right" style="width: 13px; height: 13px;"></i>
      <span id="crumb-title" style="color: var(--text-muted);">…</span>
    </nav>
    <article class="md" id="content">
      <p style="color: var(--text-ghost);">Loading…</p>
    </article>
    <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line-hair);">
      <a id="edit-link" href="https://github.com/Anmolnoor/skep" class="link-arrow muted" style="font-size: 13.5px;"><i data-lucide="pencil" style="width: 14px; height: 14px;"></i><span>Edit this page on GitHub</span></a>
      <a href="https://github.com/Anmolnoor/skep/issues" class="link-arrow muted" style="font-size: 13.5px;"><i data-lucide="message-circle" style="width: 14px; height: 14px;"></i><span>Report a problem</span></a>
    </div>
  </main>

  <aside class="rail-right">
    <div style="margin-bottom: 12px; font-size: 13px; font-weight: 650; color: var(--text-bright);">On this page</div>
    <nav class="toc" id="toc"></nav>
  </aside>
</div>

<script>
// slug -> { file in this directory, display title fallback, sidebar group }
const DOC_MAP = {
  'quickstart':      { file: 'quickstart.md', title: 'Quickstart', group: 'Get started' },
  'new-machine':     { file: 'how-to-use-on-new-machine.md', title: 'Use on a new machine', group: 'Get started' },
  'how-it-works':    { file: 'how-it-works.md', title: 'How Skep Works', group: 'Core concepts' },
  'sandboxing':      { file: 'sandboxing.md', title: 'Sandboxing', group: 'Core concepts' },
  'verification':    { file: 'verification.md', title: 'Re-Verification', group: 'Core concepts' },
  'approvals':       { file: 'approvals.md', title: 'Approvals & Templates', group: 'Core concepts' },
  'workers':         { file: 'workers.md', title: 'Worker Adapters', group: 'Core concepts' },
  'cli':             { file: 'cli-reference.md', title: 'CLI Reference', group: 'Reference' },
  'configuration':   { file: 'configuration.md', title: 'Configuration', group: 'Reference' },
  'brain':           { file: 'brain.md', title: 'The Brain Dial', group: 'Reference' },
  'assistant-tools': { file: 'assistant-tools.md', title: 'Assistant Tools', group: 'Reference' },
  'browser':         { file: 'browser.md', title: 'Browser MCP', group: 'Reference' },
  'mobile':          { file: 'mobile.md', title: 'Mobile', group: 'Reference' },
  'invariants':      { file: 'invariants.md', title: 'Invariants', group: 'Reference' },
  'version-history': { file: 'version-history.md', title: 'Version History', group: 'Reference' },
};
const GH_BLOB = 'https://github.com/Anmolnoor/skep/blob/main/docs/';
const FILE_TO_SLUG = Object.fromEntries(Object.entries(DOC_MAP).map(([slug, d]) => [d.file, slug]));

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function rewriteHref(href) {
  if (/^(https?:|mailto:|#)/.test(href)) return href;
  const clean = href.replace(/^\.\//, '');
  const [path, anchor] = clean.split('#');
  const base = path.split('/').pop();
  if (FILE_TO_SLUG[base] && !path.includes('/')) {
    return 'doc.html?d=' + FILE_TO_SLUG[base] + (anchor ? '#' + anchor : '');
  }
  if (path.endsWith('.md')) return GH_BLOB + path + (anchor ? '#' + anchor : '');
  return href;
}

function inline(s) {
  let out = esc(s);
  const codes = [];
  out = out.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\x00' + (codes.length - 1) + '\x00'; });
  out = out
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => `<a href="${rewriteHref(href)}">${text}</a>`)
    .replace(/&lt;(https?:\/\/[^&\s]+)&gt;/g, '<a href="$1">$1</a>');
  return out.replace(/\x00(\d+)\x00/g, (_, i) => '<code>' + codes[+i] + '</code>');
}

function slugify(text) {
  return text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-');
}

// ponytail: small line-based markdown renderer — headings, fences, lists,
// tables, quotes, hr. Enough for these docs; swap for a lib if it ever falls short.
function renderMd(src) {
  const lines = src.split('\n');
  const out = [];
  const toc = [];
  let i = 0, para = [], list = null;

  const flushPara = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push(list.html + (list.ordered ? '</ol>' : '</ul>')); list = null; } };
  const flush = () => { flushPara(); flushList(); };

  while (i < lines.length) {
    const line = lines[i];

    if (/^```/.test(line)) {
      flush();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      flush();
      const level = h[1].length;
      const text = inline(h[2]);
      const id = slugify(h[2]);
      out.push(`<h${level} id="${id}">${text}</h${level}>`);
      if (level === 2) toc.push({ id, text: h[2].replace(/`/g, '') });
      i++;
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flush(); out.push('<hr />'); i++; continue; }
    if (/^\s*>/.test(line)) {
      flush();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote><p>' + inline(buf.join(' ')) + '</p></blockquote>');
      continue;
    }
    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flush();
      const header = line.split('|').slice(1, -1).map((c) => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
        rows.push(lines[i].split('|').slice(1, -1).map((c) => c.trim()));
        i++;
      }
      out.push('<div class="tablewrap"><table><thead><tr>' + header.map((c) => '<th>' + inline(c) + '</th>').join('') +
        '</tr></thead><tbody>' + rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    const li = /^(\s*)([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (li) {
      flushPara();
      const ordered = /\d+\./.test(li[2]);
      if (!list || list.ordered !== ordered) { flushList(); list = { ordered, html: ordered ? '<ol>' : '<ul>' }; }
      // gather continuation lines (indented)
      let item = li[3];
      while (i + 1 < lines.length && /^\s{2,}\S/.test(lines[i + 1]) && !/^\s*([-*]|\d+\.)\s/.test(lines[i + 1])) {
        item += ' ' + lines[i + 1].trim();
        i++;
      }
      list.html += '<li>' + inline(item) + '</li>';
      i++;
      continue;
    }
    if (/^\s*$/.test(line)) { flush(); i++; continue; }
    para.push(line.trim());
    i++;
  }
  flush();
  return { html: out.join('\n'), toc };
}

function buildNav(current) {
  const groups = {};
  for (const [slug, d] of Object.entries(DOC_MAP)) {
    (groups[d.group] = groups[d.group] || []).push({ slug, title: d.title });
  }
  const order = ['Get started', 'Core concepts', 'Reference'];
  let html = '';
  for (const g of order) {
    if (!groups[g]) continue;
    html += `<div><div class="nav-group-title">${g}</div><div class="nav-group">`;
    html += groups[g].map((d) => `<a href="./doc.html?d=${d.slug}"${d.slug === current ? ' class="here"' : ''}>${d.title}</a>`).join('');
    if (g === 'Get started') html += `<a href="./install.html">Installation</a><a href="./first-run.html">First-Run Setup</a>`;
    if (g === 'Reference') html += `<a href="./changelog.html">Version History</a><a href="https://github.com/Anmolnoor/skep/tree/main/docs/adr">ADRs</a>`;
    html += '</div></div>';
  }
  html += `<div><div class="nav-group-title">Community</div><div class="nav-group">
    <a href="https://github.com/Anmolnoor/skep/blob/main/CONTRIBUTING.md">Contributing</a>
    <a href="./security.html">Security Policy</a>
    <a href="./open-source.html">Open Source</a>
    <a href="./roadmap.html">Roadmap</a></div></div>`;
  document.getElementById('doc-nav').innerHTML = html;
}

async function load() {
  const slug = new URLSearchParams(location.search).get('d') || 'quickstart';
  const doc = DOC_MAP[slug] || DOC_MAP['quickstart'];
  buildNav(slug);
  document.getElementById('crumb-title').textContent = doc.title;
  document.title = doc.title + ' — skep docs';
  document.getElementById('edit-link').href = GH_BLOB.replace('/blob/', '/edit/') + doc.file;
  try {
    const res = await fetch('./' + doc.file);
    if (!res.ok) throw new Error(res.status);
    const { html, toc } = renderMd(await res.text());
    document.getElementById('content').innerHTML = html;
    document.getElementById('toc').innerHTML = toc.map((t) => `<a href="#${t.id}">${esc(t.text)}</a>`).join('');
    if (location.hash) {
      const el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    }
  } catch {
    document.getElementById('content').innerHTML =
      `<p>Could not load this page here. Read it on <a href="${GH_BLOB + doc.file}">GitHub</a> instead.</p>`;
  }
  if (window.lucide) window.lucide.createIcons();
}
load();
</script>
</body>
</html>
